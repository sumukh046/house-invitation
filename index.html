<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigating to Location...</title>
    <meta http-equiv="refresh" content="0;url=https://maps.app.goo.gl/7BypEjExeaCF8YkL7?g_st=ic">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0fdf4;
            color: #1a2e1a;
        }
        .wrap {
            text-align: center;
            padding: 40px 24px;
        }
        .icon { font-size: 48px; margin-bottom: 16px; animation: pulse 1.5s ease-in-out infinite; }
        h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #14662B; }
        p { font-size: 14px; color: #6b8a6b; margin-bottom: 24px; }
        a {
            display: inline-block;
            background: #1B8C3A;
            color: white;
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="icon">📍</div>
        <h1>Opening Google Maps...</h1>
        <p>If not redirected automatically, tap below</p>
        <a href="https://maps.app.goo.gl/7BypEjExeaCF8YkL7?g_st=ic">Open Location</a>
    </div>
    <script>
        window.location.href = "https://maps.app.goo.gl/7BypEjExeaCF8YkL7?g_st=ic";
    </script>
</body>
</html>
